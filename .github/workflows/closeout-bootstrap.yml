name: One-time reviewed implementation import
on:
  pull_request:
    paths:
      - '.github/workflows/closeout-bootstrap.yml'
permissions:
  contents: read
jobs:
  import:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/intelligence-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Reconstruct and validate immutable reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os,json,base64,hashlib,lzma,urllib.request,subprocess,pathlib
          chunks=['851d6dd46e9960ff563a453560db2da1dec23b64','7d149814a69f41e2d44ae1631c8f6274ce99bfcc','6f6c0337004e4ed130a394f36c6070926cfca85a','b379c705751ce24c27a9c1bccaec8283b9bb94d0','e620c06ef7e1934bcbcdcf24d2258f3d5552da8d','28f06e8d2f53e2bd24610c93b230b9cafed4abdc','470be6297ef9b4759bbf9a1ce12e5a16f1a788b0','9840c0202b934b08628921a3b7efee8fa69ef02a','54a7447530b4bcd866a96cf970a666a143055fcb']
          segments=[]
          for sha in chunks:
            req=urllib.request.Request('https://api.github.com/repos/'+os.environ['REPO']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            obj=json.load(urllib.request.urlopen(req,timeout=30));b=base64.b64decode(obj['content'])
            assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
            segments.append(b)
          patch=lzma.decompress(base64.b64decode(b''.join(segments)))
          assert len(patch)==209753
          assert hashlib.sha256(patch).hexdigest()=='a15fc2cdf1246fec378b7e9abe45eb08a449e399967d4493d4aa9356120b7248'
          path='/tmp/reviewed.patch';pathlib.Path(path).write_bytes(patch)
          names=[]
          for line in patch.decode().splitlines():
            if line.startswith('+++ b/'):
              n=line[6:];p=pathlib.PurePosixPath(n)
              assert '..' not in p.parts and not p.is_absolute() and not n.startswith('.github/')
              assert n in ['.dockerignore','Dockerfile','next.config.ts'] or n.startswith(('src/','scripts/','tests/'))
              names.append(n)
          assert len(set(names))==34
          subprocess.run(['git','apply','--check',path],check=True)
          subprocess.run(['git','apply',path],check=True)
          pathlib.Path('/tmp/changed-paths.json').write_text(json.dumps(sorted(set(names))))
          print('REVIEWED_PATCH_VERIFIED',len(names))
          PY
      - name: Adopt exact source tree on unchanged review branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const base='https://api.github.com/repos/'+process.env.REPO;
          const branch='feat/intelligence-closeout';
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'};
          async function api(path,method='GET',body){const r=await fetch(base+path,{method,headers,body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error('GitHub '+r.status+' '+path);return r.json();}
          (async()=>{
            const head=await api('/git/ref/heads/'+branch);
            if(head.object.sha!==process.env.EXPECTED_HEAD)throw new Error('Review branch changed; refusing update');
            const commit=await api('/git/commits/'+head.object.sha);
            const names=JSON.parse(fs.readFileSync('/tmp/changed-paths.json'));
            const tree=await api('/git/trees','POST',{base_tree:commit.tree.sha,tree:names.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}))});
            const created=await api('/git/commits','POST',{message:'Implement independent intelligence, source controls and semantic watches',tree:tree.sha,parents:[head.object.sha]});
            const check=await api('/git/ref/heads/'+branch);
            if(check.object.sha!==head.object.sha)throw new Error('Review branch changed before adoption');
            await api('/git/refs/heads/'+branch,'PATCH',{sha:created.sha,force:false});
            console.log('IMPLEMENTATION_IMPORTED '+created.sha+' files='+names.length);
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
