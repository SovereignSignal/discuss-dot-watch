name: Source audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/audit-sources.mjs'
      - 'tests/sourceAudit.test.mjs'
      - '.github/workflows/source-audit.yml'

permissions:
  contents: read

concurrency:
  group: source-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Bounded read-only source audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Match repository npm version
        run: npm i -g npm@11
      - name: Install
        run: npm ci
      - name: Audit helper tests
        run: node --test tests/sourceAudit.test.mjs
      - name: Collect source evidence
        run: node --import tsx scripts/audit-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-audit-batch4
          path: audit-results/
          retention-days: 30
          if-no-files-found: warn
