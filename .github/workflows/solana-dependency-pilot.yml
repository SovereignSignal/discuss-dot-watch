name: Dependency and RPC contracts
on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'src/lib/realmsClient.ts'
      - 'tests/realmsDependency.test.ts'
      - '.github/workflows/solana-dependency-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - name: Verify locked dependency replacement
        run: |
          npm ls @solana/web3.js jayson
          node -e "const p=require('./package-lock.json').packages;if(p['node_modules/jayson'].version!=='5.0.0')process.exit(1);if(Object.keys(p).some(k=>/node_modules\/stream-json$/.test(k)))process.exit(1)"
      - run: npm run typecheck
      - run: node --import tsx --test tests/realmsDependency.test.ts
      - run: npm audit --omit=dev --audit-level=low
      - name: Ensure install did not change the committed lock
        run: git diff --exit-code -- package.json package-lock.json
