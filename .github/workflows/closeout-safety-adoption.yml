name: One-time closeout safety adoption
on:
  pull_request:
    paths:
      - '.github/workflows/closeout-safety-adoption.yml'
permissions:
  contents: read
concurrency:
  group: closeout-safety-adoption
  cancel-in-progress: true
jobs:
  verify-and-adopt:
    if: github.event.pull_request.number == 90 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/intelligence-closeout'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - run: python3 .github/scripts/apply-closeout-safety.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: node scripts/lint-root-contract.mjs
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Commit only reviewed application files with head lease
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const repo=process.env.REPOSITORY,expected=process.env.EXPECTED_HEAD;
          const paths=['scripts/operator-browser-smoke.mjs','src/components/IntelligenceOperator.tsx','src/lib/intelligenceStore.ts','src/lib/intelligenceWorker.ts','src/lib/operatorIntelligence.ts','src/lib/sourceAdapters.ts','src/lib/strictFeed.ts','tests/intelligenceIntegration.test.ts','tests/sourceBodyText.test.ts'];
          const headers={Authorization:'Bearer '+process.env.GH_TOKEN,'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'};
          async function api(path,method='GET',body){const r=await fetch('https://api.github.com/repos/'+repo+path,{method,headers,body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw new Error(method+' '+path+' '+r.status);return data;}
          (async()=>{
            const ref=await api('/git/ref/heads/feat/intelligence-closeout');
            if(ref.object.sha!==expected)throw new Error('Head lease mismatch');
            const base=await api('/git/commits/'+expected);
            const tree=await api('/git/trees','POST',{base_tree:base.tree.sha,tree:paths.map(path=>({path,mode:'100644',type:'blob',content:fs.readFileSync(path,'utf8')}))});
            const commit=await api('/git/commits','POST',{message:'Harden independent intelligence migration, notification, source evidence and operator lock safety',tree:tree.sha,parents:[expected]});
            if((await api('/git/ref/heads/feat/intelligence-closeout')).object.sha!==expected)throw new Error('Head lease lost');
            await api('/git/refs/heads/feat/intelligence-closeout','PATCH',{sha:commit.sha,force:false});
            console.log('SAFETY_ADOPTION '+JSON.stringify({commit:commit.sha,parent:expected,paths}));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
