name: Corpus pilot integration
on:
  pull_request:
    paths:
      - 'src/lib/corpus*.ts'
      - 'src/lib/opportunity*.ts'
      - 'src/lib/briefRoleSelection.ts'
      - 'src/lib/grantsStore.ts'
      - 'src/app/api/admin/corpus/**'
      - 'src/app/api/v1/corpus/**'
      - 'src/app/api/v1/opportunities/**'
      - 'src/app/app/corpus/**'
      - 'tests/corpus*.test.ts'
      - 'tests/opportunity*.test.ts'
      - '.github/workflows/corpus-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: corpus_test_only
          POSTGRES_DB: corpus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - run: node --import tsx --test --test-concurrency=1 tests/corpusPolicy.test.ts tests/corpusIntegration.test.ts tests/opportunityFit.test.ts tests/opportunityFeedIntegration.test.ts
        env:
          CORPUS_TEST_DATABASE_URL: postgres://postgres:corpus_test_only@localhost:5432/corpus_test
