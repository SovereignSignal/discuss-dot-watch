name: Corpus pilot integration
on:
  pull_request:
    paths:
      - 'src/lib/**'
      - 'src/app/api/**'
      - 'tests/**'
      - '.github/workflows/corpus-pilot.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus-pilot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: PostgreSQL ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - corpusIntegration
          - opportunityFeedIntegration
          - surfaceObservability
          - intelligenceIntegration
          - corpusReadinessIntegration
    # Every suite owns a fresh service database. Native cutover tests publish
    # fixture records by design; those must never contaminate another suite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: corpus_test_only
          POSTGRES_DB: corpus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm i -g npm@11
      - run: npm ci
      - run: node --import tsx --test --test-concurrency=1 tests/${{ matrix.suite }}.test.ts
        env:
          CORPUS_TEST_DATABASE_URL: postgres://postgres:corpus_test_only@localhost:5432/corpus_test
