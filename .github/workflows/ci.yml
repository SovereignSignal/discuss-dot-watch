name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test · typecheck · lint · build · audit
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Pin npm to 11
        run: npm i -g npm@11
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Next lint dependency contract
        run: node scripts/lint-root-contract.mjs
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      # Both locked graphs are clean. Registry failure or any advisory fails CI.
      - name: Production audit (blocking all severities)
        run: npm audit --omit=dev --audit-level=low
      - name: Full dependency audit (blocking all severities)
        run: npm audit --audit-level=low
