name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test · typecheck · lint · build · audit
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Match the npm major used to generate the lockfile and by production.
      - name: Pin npm to 11 (match production)
        run: npm i -g npm@11

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Production high/critical findings or registry failures now block CI.
      # The Oct 4 audit reported five moderate production package entries;
      # passing this threshold does not mean all vulnerabilities are resolved.
      - name: Production audit (blocking high+)
        run: npm audit --omit=dev --audit-level=high

      # Preserve visibility of the separate development-only chain through
      # braces -> micromatch -> fast-glob -> the Next ESLint plugin/config.
      # Full and production JSON reports are archived by Release assurance.
      # Do not force npm's suggested major downgrades as an automatic fix.
      - name: Full dependency audit (advisory)
        run: npm audit --audit-level=high
        continue-on-error: true
